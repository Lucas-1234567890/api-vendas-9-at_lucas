name: Build fornecedores-service

on: push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: api-vendas-9/fornecedores-service/pom.xml

      - name: Compilar com Maven
        run: mvn -B package
        working-directory: api-vendas-9/fornecedores-service
